<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AN THAI | Hệ thống tích điểm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#e00000;--background:#f7f7fb;--text:#303030}
body{font-family:Arial,Helvetica,sans-serif;background:var(--background);color:var(--text);min-height:100vh;overflow-x:hidden}

/* LAYOUT: số đo lấy từ bản thiết kế 2576px (lề 4.1vw, thẻ đỏ 38.6vw, form 38vw) */
.page{min-height:100vh;display:grid;grid-template-columns:38.6% 1fr;align-items:center;padding:5.5vh 4.1vw;position:relative;isolation:isolate}

.orb{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
.orb-one{width:850px;height:850px;top:-400px;left:-200px;background:rgba(255,255,255,.65)}
.orb-two{width:720px;height:720px;top:-80px;right:-100px;background:rgba(240,238,249,.55)}
.orb-three{width:520px;height:520px;bottom:-400px;right:5%;background:rgba(255,255,255,.45)}

/* THẺ ĐỎ */
.visual-card{
  width:100%;height:88.7vh;min-height:520px;position:relative;overflow:hidden;isolation:isolate;
  border-radius:27px;
  background:linear-gradient(200deg,#a80000 0%,#7d0000 45%,#470000 100%); /* gradient, không phải màu phẳng */
}
/* VIDEO: nền đen + mix-blend-mode:screen => nền biến mất, chỉ còn hình kính */
.video-area{position:absolute;z-index:1;inset:auto 0 0 0;height:70%;pointer-events:none;mix-blend-mode:screen}
.video-area video{display:block;width:100%;height:100%;object-fit:cover;object-position:82% 100%}
.video-area .still{display:none;width:100%;height:100%;object-fit:cover;object-position:30% 100%}
@media (prefers-reduced-motion:reduce){.video-area video{display:none}.video-area .still{display:block}}

.headline{
  position:absolute;z-index:2;top:6.5%;right:8%;width:86%;color:#fff;text-align:right;
  font-family:Montserrat,Arial,sans-serif;font-size:clamp(24px,2.65vw,46px);line-height:1.32;font-weight:700;pointer-events:none
}

/* PHẢI */
.right-panel{width:min(100%,38vw);margin:0 5vw 0 auto}
.brand{display:flex;justify-content:flex-start;margin-bottom:clamp(56px,18vh,200px)}
.brand-logo{display:block;width:56%;max-width:430px;height:auto}

.field{margin-bottom:clamp(24px,3vw,50px)}
.field label{display:block;font-size:clamp(16px,1.45vw,24px);margin-bottom:.5vw;color:#363636}
.field input{
  display:block;width:100%;height:clamp(52px,4.2vw,80px);padding:0 1.8vw;border:1px solid #a5a5a5;border-radius:16px;
  background:rgba(255,255,255,.12);color:#151515;font-family:inherit;font-size:clamp(16px,1.2vw,20px);outline:none;
  transition:border-color .2s,box-shadow .2s
}
.field:first-child input{border-color:#d94747}
.field input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,0,0,.07)}
.field input::placeholder{color:#858585;opacity:1}
.password-wrap{position:relative}
.password-wrap input{padding-right:64px}
.toggle-password{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#777;cursor:pointer;padding:8px;display:grid;place-items:center}
.toggle-password:focus-visible{outline:2px solid var(--red);border-radius:8px}

.login-button{
  width:100%;min-height:clamp(54px,4.3vw,72px);border:0;border-radius:14px;
  background:linear-gradient(180deg,#ff0808 0%,#c90000 100%);color:#fff;font-family:inherit;font-size:clamp(17px,1.35vw,22px);font-weight:500;cursor:pointer;
  box-shadow:0 13px 23px rgba(220,0,0,.19);transition:transform .2s,box-shadow .2s
}
.login-button:hover{transform:translateY(-2px);box-shadow:0 16px 28px rgba(220,0,0,.24)}
.login-button:active{transform:none}
.message{display:none;margin-top:18px;color:#b00000;font-size:14px;line-height:1.5;text-align:center}

/* TABLET + MOBILE: xếp dọc */
@media (max-width:900px){
  .page{display:flex;flex-direction:column;gap:34px;padding:24px 20px 40px}
  .visual-card{height:auto;min-height:0;aspect-ratio:.95;max-width:520px;margin:0 auto}
  .video-area{height:62%}
  .headline{font-size:clamp(22px,5.6vw,32px);top:6%;right:7%;width:88%}
  .right-panel{width:100%;max-width:520px;margin:0 auto}
  .brand{margin-bottom:44px}
  .brand-logo{width:min(70%,320px)}
  .field{margin-bottom:26px}
  .field label{font-size:17px;margin-bottom:8px}
  .field input{height:58px;padding:0 18px;border-radius:12px;font-size:17px}
  .login-button{min-height:58px;border-radius:12px;font-size:18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <div class="orb orb-one"></div><div class="orb orb-two"></div><div class="orb orb-three"></div>

  <section class="visual-card">
    <h1 class="headline">Tích lũy điểm thưởng,<br>thêm nhiều quyền lợi<br>thiết thực.</h1>
    <div class="video-area">
      <video autoplay muted loop playsinline preload="auto" aria-label="Hiệu ứng thủy tinh đỏ AN THAI">
        <source src="./assets/hero.mp4" type="video/mp4">
      </video>
      <img class="still" src="./assets/hero.png" alt="">
    </div>
  </section>

  <section class="right-panel">
    <div class="brand"><img class="brand-logo" src="./assets/logo.svg" alt="AN THAI - Hệ thống tích điểm"></div>
    <form class="login-form" id="loginForm">
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" placeholder="Nhập tên đăng nhập" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Hiện mật khẩu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="login-button">Đăng nhập</button>
      <p class="message" id="message" role="status"></p>
    </form>
  </section>
</main>

<script>
const passwordInput=document.getElementById("password");
const toggleButton=document.getElementById("togglePassword");
const loginForm=document.getElementById("loginForm");
const message=document.getElementById("message");

toggleButton.addEventListener("click",()=>{
  const hidden=passwordInput.type==="password";
  passwordInput.type=hidden?"text":"password";
  toggleButton.setAttribute("aria-label",hidden?"Ẩn mật khẩu":"Hiện mật khẩu");
});

// Demo: chưa có xác thực thật (GitHub Pages chỉ host file tĩnh)
loginForm.addEventListener("submit",e=>{
  e.preventDefault();
  message.textContent="Giao diện đã hoạt động. Cần kết nối hệ thống xác thực để đăng nhập.";
  message.style.display="block";
});
</script>
</body>
</html>
