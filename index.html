
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AN THAI | Hệ thống tích điểm</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --red: #e00000;
      --dark-red: #990000;
      --text: #303030;
      --bg: #f7f7fb;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 44% 56%;
      align-items: center;
      padding: 4.5vh 4.1vw;
      position: relative;
      isolation: isolate;
    }

    /* Background circles */
    .orb {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.58);
      z-index: -1;
      pointer-events: none;
    }

    .orb-one {
      width: 850px;
      height: 850px;
      top: -390px;
      left: -200px;
    }

    .orb-two {
      width: 680px;
      height: 680px;
      top: -50px;
      right: -100px;
      background: rgba(241, 239, 250, 0.48);
    }

    .orb-three {
      width: 540px;
      height: 540px;
      bottom: -420px;
      right: 5%;
    }

    /* Left visual panel */
    .visual-card {
      width: 100%;
      max-width: 790px;
      aspect-ratio: 0.88;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(
          ellipse at 60% 55%,
          #ff1010 0%,
          #d90000 42%,
          #870000 100%
        );
      box-shadow: 0 12px 36px rgba(90, 0, 0, 0.06);
    }

    .visual-card video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .visual-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(100, 0, 0, 0.12) 0%,
        transparent 42%,
        rgba(80, 0, 0, 0.04) 100%
      );
      pointer-events: none;
    }

    .headline {
      position: absolute;
      z-index: 2;
      top: 7%;
      right: 7%;
      width: 83%;
      color: white;
      text-align: right;
      font-size: clamp(23px, 2.65vw, 46px);
      line-height: 1.38;
      font-weight: 700;
      letter-spacing: -0.7px;
      text-shadow: 0 2px 10px rgba(80, 0, 0, 0.1);
      pointer-events: none;
    }

    /* Right section */
    .right-panel {
      width: 100%;
      max-width: 760px;
      justify-self: center;
      padding: 20px 1.5vw 20px 6.2vw;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: clamp(70px, 9.5vw, 160px);
    }

    .brand-symbol {
      width: 82px;
      height: 58px;
      flex-shrink: 0;
    }

    .brand-name {
      color: #080808;
      font-size: clamp(30px, 3.1vw, 51px);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.05;
      white-space: nowrap;
    }

    .brand-subtitle {
      font-size: clamp(12px, 1.1vw, 19px);
      letter-spacing: 3px;
      font-weight: 600;
      margin-top: 5px;
      white-space: nowrap;
    }

    .login-form {
      width: 100%;
    }

    .field {
      margin-bottom: 48px;
    }

    .field label {
      display: block;
      font-size: clamp(18px, 1.5vw, 25px);
      margin-bottom: 12px;
      color: #363636;
    }

    .field input {
      display: block;
      width: 100%;
      height: 72px;
      padding: 0 29px;
      border: 1px solid #a5a5a5;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.13);
      color: #151515;
      font-family: inherit;
      font-size: 20px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(224, 0, 0, 0.07);
    }

    .field:first-child input {
      border-color: #d94747;
    }

    .field input::placeholder {
      color: #777;
      opacity: 1;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 70px;
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #777;
      cursor: pointer;
      padding: 8px;
      font-size: 18px;
    }

    .login-button {
      width: 100%;
      min-height: 67px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(180deg, #ff0808, #c90000);
      color: white;
      font-size: 21px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 13px 23px rgba(220, 0, 0, 0.19);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(220, 0, 0, 0.24);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .message {
      display: none;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      color: #b00000;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .page {
        grid-template-columns: 42% 58%;
        padding: 30px 3vw;
      }

      .visual-card {
        aspect-ratio: 0.72;
      }

      .headline {
        font-size: clamp(21px, 3vw, 30px);
      }

      .right-panel {
        padding-left: 5vw;
      }

      .brand {
        gap: 10px;
        margin-bottom: 70px;
      }

      .brand-symbol {
        width: 55px;
      }

      .field {
        margin-bottom: 30px;
      }

      .field input {
        height: 60px;
        padding: 0 18px;
        font-size: 17px;
      }

      .login-button {
        min-height: 58px;
      }
    }

    @media (max-width: 600px) {
      .page {
        display: flex;
        flex-direction: column;
        gap: 34px;
        padding: 22px 20px 40px;
      }

      .visual-card {
        max-width: 440px;
        aspect-ratio: 0.95;
      }

      .headline {
        top: 6%;
        right: 6%;
        width: 88%;
        font-size: clamp(23px, 6vw, 31px);
      }

      .right-panel {
        padding: 0;
        max-width: 440px;
      }

      .brand {
        margin-bottom: 42px;
        gap: 12px;
      }

      .brand-symbol {
        width: 62px;
        height: 45px;
      }

      .brand-name {
        font-size: 34px;
      }

      .brand-subtitle {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .field {
        margin-bottom: 26px;
      }

      .field label {
        font-size: 18px;
      }

      .field input {
        height: 58px;
        border-radius: 12px;
      }

      .login-button {
        min-height: 58px;
        border-radius: 12px;
        font-size: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="orb orb-three"></div>

    <!-- Left: video and headline -->
    <section class="visual-card" aria-label="AN THAI">
      <video
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster=""
        aria-label="Video hiệu ứng thủy tinh đỏ"
      >
        <source
          src="./gemini_generated_video_e01c35c6.mp4"
          type="video/mp4"
        >
        Trình duyệt không hỗ trợ video.
      </video>

      <h1 class="headline">
        Tích lũy điểm thưởng,<br>
        thêm nhiều quyền lợi<br>
        thiết thực.
      </h1>
    </section>

    <!-- Right: logo and login -->
    <section class="right-panel">
      <div class="brand">
        <!-- Red abstract brand symbol -->
        <svg
          class="brand-symbol"
          viewBox="0 0 100 65"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="brandRed" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#a80000"/>
              <stop offset="55%" stop-color="#e00000"/>
              <stop offset="100%" stop-color="#ff2929"/>
            </linearGradient>
          </defs>
          <path
            d="M4 20 Q17 5 31 18 L49 36 Q56 43 64 34 L72 26 L85 40 L74 51 Q57 66 40 49 L20 30 Q14 24 9 29 Z"
            fill="url(#brandRed)"
          />
          <path
            d="M45 18 L57 7 Q65 0 73 9 L96 33 L82 46 L65 27 Q61 23 57 28 L54 31 Z"
            fill="url(#brandRed)"
          />
        </svg>

        <div class="brand-copy">
          <div class="brand-name">AN THAI</div>
          <div class="brand-subtitle">HỆ THỐNG TÍCH ĐIỂM</div>
        </div>
      </div>

      <form class="login-form" id="loginForm">
        <div class="field">
          <label for="username">Tên đăng nhập</label>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="Nhập tên đăng nhập"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">Mật khẩu</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Hiện mật khẩu"
            >◉</button>
          </div>
        </div>

        <button type="submit" class="login-button">
          Đăng nhập
        </button>

        <p class="message" id="message" role="status"></p>
      </form>
    </section>
  </main>

  <script>
    const passwordInput = document.getElementById("password");
    const toggleButton = document.getElementById("togglePassword");
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    toggleButton.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      toggleButton.setAttribute(
        "aria-label",
        isHidden ? "Ẩn mật khẩu" : "Hiện mật khẩu"
      );
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      message.textContent =
        "Giao diện đã hoạt động. Cần kết nối hệ thống xác thực để đăng nhập.";
      message.style.display = "block";
    });
  </script>
</body>
</html>
